<!DOCTYPE html>
<html>
<head>
    <title>3D Test</title>
    <style>
        body { margin: 0; background: #f0f0f0; }
        #container { width: 100%; height: 100vh; }
        #info { position: absolute; top: 10px; left: 10px; color: black; }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="info">Testing 3D Viewer...</div>

    <script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
    <script>
        console.log("Three.js loaded:", typeof THREE);
        
        // Simple test - just show a rotating cube first
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);
        
        // Test cube
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        
        camera.position.z = 5;
        
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();
        
        document.getElementById('info').textContent = "Green cube should be rotating";
    </script>
</body>
</html>
